en:
  label_stats: Stats
  permission_view_rubylode_stats: View stats
  project_module_rubylode_stats: Stats
  rubylode_stats:
    none: None
    no_version: No version
    not_available: n/a
    date_range: "%{first} to %{last}"
    tickets: Tickets
    tickets_by: Tickets by
    person: Person
    days_to_close: Days to close
    median_days: Median days to close
    period: Period
    slice_by: Slice by
    all_tickets: All tickets
    all_closed: All closed tickets
    share_of_total: Share of total
    share_of_period: Share of the period
    share_of_closed: Share of closed tickets
    share_within: Closed in this time or faster
    period_total: Total closed
    change_title: "%{name} versus previous %{period}"
    legend_with_count: "%{state} %{tickets} (%{percent}%)"
    filters_and_options: Filters and options
    filters_active: "%{count} active"
    view_data: View data
    data_caption: "Figures behind the chart: %{chart}"
    series:
      opened: Opened
      closed: Closed
      backlog: Backlog
    states:
      open: Open
      closed: Closed
    periods:
      day: Day
      week: Week
      month: Month
    period_units:
      day: days
      week: weeks
      month: months
    slices:
      category: Category
      version: Version
      assignee: Assignee
      tracker: Tracker
      priority: Priority
      author: Author
    presets:
      this_week: This week
      this_month: This month
      this_quarter: This quarter
      last_30_days: Last 30 days
      this_year: This year
      all_time: All time
    tabs:
      overview: Overview
      people: People
      speed: Speed
      versions: Versions
      empty: No charts on this tab yet.
    progress:
      done: Done
      remaining: Remaining
      end: "%{percent}% (%{done} of %{total})"
      row_due: "%{name}  ·  due %{date}"
      overdue: "(overdue)"
      percent: Percent done
    charts:
      tickets_by_status:
        title: Tickets by status
        subtitle: Where does the work sit right now?
      tickets_by_slice:
        subtitle: Which areas take most of the tickets?
      open_versus_closed:
        title: Open versus closed
        subtitle: How much of the work is finished, whatever the status filter says?
        note: "The status filter is ignored here: this card always counts open and closed tickets."
      opened_and_closed:
        title: Opened and closed
        subtitle: Is the backlog growing or shrinking?
      closed_per_person:
        title: Closed per person
        subtitle: Who closed the tickets, period by period?
      time_to_close_histogram:
        title: Time to close
        subtitle: How long do tickets take, from created to closed?
      median_time_to_close:
        title: Median time to close
        subtitle: Is the median time to close getting shorter?
      progress_per_version:
        title: Progress per version
        subtitle: How much of each version is done, in order of due date?
        note: "Ordered by due date; versions without a date come last. Percent done is closed tickets divided by all tickets in the version."
    tiles:
      open: Open
      open_detail:
        one: "of %{count} ticket"
        other: "of %{count} tickets"
      closed_in_range: Closed in range
      closed_in_range_detail: "%{percent}% of the tickets counted"
      closed_in_range_detail_empty: "of the tickets counted"
      median_days: Median days to close
      median_days_detail:
        one: "%{count} closed ticket"
        other: "%{count} closed tickets"
      median_days_unit: days
      backlog_change: Backlog change
      backlog_growing: "Growing: up %{difference} in %{periods} %{period_name}"
      backlog_shrinking: "Shrinking: down %{difference} in %{periods} %{period_name}"
      backlog_steady: "Steady: no change in %{periods} %{period_name}"
      backlog_empty: No data
    table:
      tickets: Ticket list
      open_tickets: Show tickets
      open_opened: Show opened tickets
      open_closed: Show closed tickets
    settings:
      palette_preset:
        label: Chart colors
        hint: "Follow the theme uses the theme's chart colors, and Editorial when the theme defines none. The other choices ignore the theme."
        choices:
          follow_theme: Follow the theme
          editorial: Editorial
          material: Material
          color_blind_safe: Color-blind safe
          data_visualization: Data visualization
          custom: Custom
      custom_colors:
        label: Custom colors
        hint: "Used with Custom. Enter 1 to 10 hex colors separated by commas. The first draws single-series charts."
      custom_open_color:
        label: Custom color for open
        hint: "Optional hex color. If empty, open takes the first custom color."
      custom_closed_color:
        label: Custom color for closed
        hint: "Optional hex color. If empty, closed takes the second custom color, or the first when there is only one."
      custom_neutral_color:
        label: Custom color for neutral
        hint: "Optional hex color. If empty, neutral is a gray."
    errors:
      palette_preset: "Chart colors: \"%{value}\" is not one of Follow the theme, Editorial, Material, Color-blind safe, Data visualization or Custom."
      custom_colors_missing: "Custom colors: enter at least one color."
      custom_colors_too_many: "Custom colors: enter no more than %{count} colors."
      custom_colors_invalid:
        one: "Custom colors: %{values} is not a hex color such as #abc or #aabbcc."
        other: "Custom colors: %{values} are not hex colors such as #abc or #aabbcc."
      role_color: "Custom color for %{role}: \"%{value}\" is not a hex color such as #abc or #aabbcc."
